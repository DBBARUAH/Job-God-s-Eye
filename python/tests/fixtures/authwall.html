<!DOCTYPE html>
<html lang="en">
<head><title>Sign Up | LinkedIn</title></head>
<body>
  <main class="authwall">
    <h1>Join LinkedIn to see this page</h1>
    <form action="https://www.linkedin.com/uas/login-submit" method="post">
      <input autocomplete="username" name="session_key" type="text">
      <input autocomplete="current-password" name="session_password" type="password">
    </form>
  </main>
</body>
</html>
